version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - FLASK_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - trade_db:/app/data

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  trade_db:
